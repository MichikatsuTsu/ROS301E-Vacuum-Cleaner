<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
  <rect width="940" height="400" rx="12" fill="#ffffff"/>
  <style>
    .heading{font: 700 19px system-ui, sans-serif;fill:#1e293b}
    .node{font:700 18px system-ui,sans-serif;fill:#172b4d}
    .sm{font:13px system-ui,sans-serif;fill:#334155}
    .label{font:600 13px system-ui,sans-serif;fill:#0369a1}
    .box{fill:#f1f5f9;stroke:#64748b;stroke-width:2}
    .wire{fill:none;stroke:#0f766e;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#0f766e"/></marker></defs>
  <text x="32" y="40" class="heading">ROS 2 Autonomous Home Vacuum - Software Architecture</text>
  <rect x="45" y="104" width="243" height="104" rx="9" class="box"/>
  <text x="166" y="133" class="node" text-anchor="middle">Hardware Driver</text>
  <text x="166" y="156" class="sm" text-anchor="middle">/hardware_driver</text>
  <text x="166" y="182" class="sm" text-anchor="middle">Simulated battery/sensors</text>
  <rect x="45" y="262" width="243" height="104" rx="9" class="box"/>
  <text x="166" y="291" class="node" text-anchor="middle">Map Loader</text>
  <text x="166" y="314" class="sm" text-anchor="middle">/map_loader</text>
  <text x="166" y="338" class="sm" text-anchor="middle">Grid map + initial pose</text>
  <rect x="654" y="164" width="241" height="138" rx="9" class="box"/>
  <text x="775" y="200" class="node" text-anchor="middle">Task Manager</text>
  <text x="775" y="226" class="sm" text-anchor="middle">/task_manager</text>
  <text x="775" y="252" class="sm" text-anchor="middle">Action goal / feedback</text>
  <text x="775" y="275" class="sm" text-anchor="middle">Result / cancellation</text>
  <path d="M288 154 H484 V199 H654" class="wire"/>
  <text x="467" y="134" class="label" text-anchor="middle">/vacuum/status (1 Hz)</text>
  <path d="M288 318 H503 V266 H654" class="wire"/>
  <text x="467" y="339" class="label" text-anchor="middle">/vacuum/active_floor</text>
  <rect x="350" y="12" width="290" height="70" rx="9" class="box"/>
  <text x="495" y="38" class="node" text-anchor="middle">User / ROS 2 CLI / rqt</text>
  <text x="495" y="60" class="sm" text-anchor="middle">Service calls, action goals, monitoring</text>
  <path d="M350 65 H20 V315 H45" class="wire"/>
  <text x="28" y="245" class="label" transform="rotate(-90 28 245)" text-anchor="middle">/vacuum/set_floor_level (service)</text>
  <path d="M640 48 H916 V232 H895" class="wire"/>
  <text x="913" y="144" class="label" transform="rotate(90 913 144)" text-anchor="middle">/vacuum/clean (action)</text>
</svg>
